# Makes src/sec10k an installable package so modules can import each other
# (from sec10k.config import ...). Install once, editable:  .venv/bin/pip install -e .
# Dependency versions stay pinned in requirements.txt (install that first).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec10k"
version = "0.1.0"
description = "GraphRAG over SEC 10-K filings"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
